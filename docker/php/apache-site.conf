# Le Cercle : seuls public/ (pages, styles, scripts) et api/ (points d'entrée PHP) sont servis.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    Alias /api /var/www/html/api

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        # En-têtes de sécurité de la page (mod_headers) ; l'API pose les siens (JsonResponse::headers).
        # CSP : scripts du site seulement, aucun script en ligne ; polices de Google Fonts.
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "same-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    </Directory>

    # api/.htaccess masque config*.php (404), comme sous WampServer.
    <Directory /var/www/html/api>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
