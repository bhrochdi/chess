# Le Cercle : seuls public/ (pages, styles, scripts) et api/ (points d'entrée PHP) sont servis.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    Alias /api /var/www/html/api

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # api/.htaccess masque config*.php (404), comme sous WampServer.
    <Directory /var/www/html/api>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
