# Le Cercle — environnement de développement Docker (alternative à WampServer)
#
#   cp .env.example .env
#   cp api/config.docker.example.php api/config.php
#   docker compose up -d --build
#   docker compose run --rm web php bin/migrate.php   (après le premier démarrage)
#   -> http://localhost:8080/
#
# Les identifiants sont lus depuis .env (ignoré par git).

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: le_cercle
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db-data:/var/lib/mysql
      # Exécuté uniquement à la première initialisation du volume
      - ./docker/mysql/initdb/02-test-database.sh:/docker-entrypoint-initdb.d/02-test-database.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASS}"]
      interval: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_NAME: le_cercle
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
